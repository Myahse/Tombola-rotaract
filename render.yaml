services:
  - type: web
    name: rotaract-tombola-api
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev
    startCommand: npm start
    healthCheckPath: /api/health
    domains:
      - api.rotaractiugb.com
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: CORS_ORIGIN
        value: https://tombola.rotaractiugb.com,https://organisateurs.rotaractiugb.com,https://campagnes.rotaractiugb.com
      - key: PUBLIC_SITE_URL
        value: https://tombola.rotaractiugb.com
      - key: PUBLIC_API_URL
        value: https://api.rotaractiugb.com
      - key: WAVE_PAY_URL
        value: https://pay.wave.com/m/M_ci_pHlyZFYyH1Su/c/ci/
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: Rotaract IUGB Club
